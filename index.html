<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <title>タイピングバトル</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
  <div class="container">

    <!-- ステージ選択画面 -->
    <div id="stageSelectScreen" style="display: block;">
      <h1>タイピングクエスト</h1>

      <!-- プレイヤーステータス（ステージ選択画面用） -->
      <div class="status-panel player-panel" id="stageSelectPlayerStatus" style="max-width:320px;margin:0 auto 18px auto;">
        <div class="status-title">プレイヤー <span id="playerLevelLabel_stage">Lv:1</span></div>
        <div class="status-hp"><span id="playerHP_stage">HP: 30 / 30</span></div>
        <div class="status-atk">ATK: <span id="playerATK_stage">1</span></div>
        <div class="status-exp">EXP: <span id="playerExp_stage">0</span> / <span id="nextExp_stage">20</span></div>
      </div>

      <div class="stage-select-area">
        <button class="stage-select-btn" data-stage="field">草原</button>
        <button class="stage-select-btn" data-stage="cave">洞窟</button>
        <button class="stage-select-btn" data-stage="forest">魔法の森</button>
        <button class="stage-select-btn" data-stage="magma">マグマの地下ダンジョン</button>
        <button class="stage-select-btn" data-stage="castle">魔王の城</button>
        <button class="stage-select-btn" id="secretStageBtn" data-stage="secret" style="display:none;">???</button>
      </div>
    </div>

    <!-- バトル画面 -->
    <div id="battleScreen" style="display: none;">
      <!-- ステータスウィンドウ風パネル -->
      <div class="status-panels">
        <div class="status-panel player-panel">
          <div class="status-title">プレイヤー <span id="playerLevelLabel">Lv:1</span></div>
          <div class="status-hp">
            <span id="playerHP">HP: 100 / 100</span>
          </div>
        </div>
        <div class="status-panel enemy-panel">
          <div class="status-title">敵</div>
          <div class="status-hp">
            <span id="enemyHP">HP: 0 / 0</span>
          </div>
        </div>
      </div>

      <div class="battle-area">
        <div id="question"><span id="word"></span></div>
        <div id="timer"><span id="time"></span></div>
        <div id="countdown"></div>
      </div>

      <!-- バトルログ・メッセージウィンドウ -->
      <div id="battleLog" class="battle-log"></div>

      <input id="input" type="text" autocomplete="off" />

      <div class="btn-area">
        <div class="flex-center">
          <button id="startBtn" onclick="startBattle(true)">バトル開始</button>
          <button id="backToStageBtn" type="button">ステージ選択に戻る</button>
        </div>

        <button id="nextBattleBtn" style="display: none" onclick="startBattle(true)">次のバトルへ</button>
      </div>

      <!-- 入力注意文（バトル前のみ） -->
      <div id="inputNotice">
        ※スタート前に「半角英数入力」になっているか確認してください。
      </div>
      <!-- 全角警告（常時チェック） -->
      <div id="zenkakuWarning">
        ※現在、全角文字が含まれています。半角英数で入力してください。
      </div>
    </div>

    <!-- エンディング画面 -->
    <div id="endingScreen" style="display:none;">
      <div class="ending-message" style="max-width:600px;margin:32px auto 24px auto;font-size:1.3rem;line-height:2;">
        <p>おめでとう！<br>あなたは魔王を倒し、世界に平和をもたらしました！</p>
        <p>勇者としての冒険はこれで終わりですが、<br>さらなる高みを目指して再び挑戦することもできます。</p>
      </div>
      <button id="endingToTitleBtn" style="font-size:1.1rem;padding:14px 38px;">タイトルへ戻る</button>
    </div>

  </div>

  <script src="./js/script.js"></script>
</body>

</html>
