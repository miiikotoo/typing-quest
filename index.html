<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>タイピングバトル</title>
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
        margin-top: 50px;
      }

      #enemy {
        display: none;
        font-size: 24px;
        font-weight: bold;
      }
      #question {
        display: none;

        font-size: 24px;
        font-weight: bold;
      }
      #timer {
        display: none;
      }
      #input {
        position: absolute;
        left: -9999px; /* 入力欄は画面外に隠す */
      }
      .correct {
        color: green;
      }
      .underline {
        border-bottom: 2px solid blue;
      }

      .player-attack {
        color: green;
        font-weight: bold;
      }
      .enemy-attack {
        color: red;
        font-weight: bold;
      }

      #damageContainerPlayer,
      #damageContainerEnemy {
        position: relative;
        width: 100%;
        height: 0;
        pointer-events: none;
      }

      .damage-popup {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        font-size: 24px;
        font-weight: bold;
        animation: floatUp 1.2s ease-out forwards;
        white-space: nowrap;
      }

      .damage-player {
        color: green;
        top: 50px; /* プレイヤーのダメージ表示位置 */
      }

      .damage-enemy {
        color: red;
        top: 150px; /* 敵のダメージ表示位置 */
      }

      @keyframes floatUp {
        0% {
          opacity: 1;
          transform: translateX(-50%) translateY(0px);
        }
        100% {
          opacity: 0;
          transform: translateX(-50%) translateY(-40px);
        }
      }
    </style>
  </head>
  <body>
    <h1>タイピングクエスト</h1>
    <div id="enemy"></div>
    <div id="enemyHP"></div>
    <div id="damageContainerPlayer"></div>
    <div id="damageContainerEnemy"></div>

    <div id="question">お題: <span id="word"></span></div>
    <div id="timer">残り時間: <span id="time">10</span>秒</div>
    <div id="countdown" style="font-size: 32px; margin-bottom: 10px"></div>

    <!-- 入力注意文（バトル前のみ） -->
    <div
      id="inputNotice"
      style="color: orange; font-weight: bold; margin-bottom: 10px"
    >
      ※スタート前に「半角英数入力」になっているか確認してください。
    </div>
    <!-- 全角警告（常時チェック） -->
    <div
      id="zenkakuWarning"
      style="color: red; font-weight: bold; margin-bottom: 10px; display: none;"
    >
      ※現在、全角文字が含まれています。半角英数で入力してください。
    </div>

    <input id="input" type="text" autocomplete="off" />

    <div id="playerHP">プレイヤーHP: 100 / 100</div>

    <div id="result"></div>

    <button id="startBtn" onclick="startBattle(true)">バトル開始</button
    ><!-- 追加ボタン -->
    <button
      id="nextBattleBtn"
      style="display: none"
      onclick="startBattle(true)"
    >
      次のバトル開始
    </button>

    <script src="./js/script.js"></script>
  </body>
</html>
